<svg viewBox="0 0 880 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="360" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" fill="#1f2328" font-size="14" font-weight="600">実装アーキテクチャ</text>
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" opacity="0.6"/></marker>
  </defs>
  <!-- Import -->
  <rect x="40" y="42" width="160" height="100" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="120" y="68" text-anchor="middle" fill="#1f2328" font-size="12" font-weight="600">Import</text>
  <text x="120" y="90" text-anchor="middle" fill="#656d76" font-size="11">Markdown</text>
  <text x="120" y="108" text-anchor="middle" fill="#656d76" font-size="11">Discussion</text>
  <text x="120" y="126" text-anchor="middle" fill="#656d76" font-size="11">Code refs</text>
  <line x1="200" y1="92" x2="262" y2="92" stroke="#0969da" stroke-width="1.5" opacity="0.5" marker-end="url(#a7)"/>
  <!-- Core -->
  <rect x="270" y="36" width="300" height="114" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-opacity="0.4"/>
  <text x="420" y="62" text-anchor="middle" fill="#0969da" font-size="15" font-weight="700">SQLite</text>
  <text x="420" y="80" text-anchor="middle" fill="#656d76" font-size="11">Canonical Storage</text>
  <rect x="290" y="96" width="80" height="28" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="330" y="115" text-anchor="middle" fill="#1f2328" font-size="10" font-weight="500">nodes</text>
  <rect x="380" y="96" width="80" height="28" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="420" y="115" text-anchor="middle" fill="#1f2328" font-size="10" font-weight="500">relations</text>
  <rect x="470" y="96" width="80" height="28" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="510" y="115" text-anchor="middle" fill="#1f2328" font-size="10" font-weight="500">prov / rev</text>
  <!-- Retrieval -->
  <rect x="270" y="188" width="300" height="100" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="420" y="216" text-anchor="middle" fill="#1f2328" font-size="13" font-weight="600">Retrieval Layer</text>
  <rect x="290" y="232" width="120" height="32" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-opacity="0.4"/>
  <text x="350" y="253" text-anchor="middle" fill="#1a7f37" font-size="11" font-weight="500">FTS（全文検索）</text>
  <rect x="430" y="232" width="120" height="32" rx="6" fill="#fbefff" stroke="#8250df" stroke-opacity="0.4"/>
  <text x="490" y="253" text-anchor="middle" fill="#8250df" font-size="11" font-weight="500">Vector Search</text>
  <text x="490" y="278" text-anchor="middle" fill="#656d76" font-size="9" font-style="italic">optional</text>
  <line x1="420" y1="150" x2="420" y2="188" stroke="#0969da" stroke-width="1.5" opacity="0.4" marker-end="url(#a7)"/>
  <!-- Rendering -->
  <rect x="660" y="42" width="180" height="72" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-opacity="0.4"/>
  <text x="750" y="68" text-anchor="middle" fill="#9a6700" font-size="12" font-weight="600">Rendering</text>
  <text x="750" y="88" text-anchor="middle" fill="#656d76" font-size="11">Markdown / HTML / JSON</text>
  <line x1="570" y1="78" x2="660" y2="78" stroke="#9a6700" stroke-width="1.5" opacity="0.4" marker-end="url(#a7)"/>
  <!-- Agent -->
  <rect x="660" y="200" width="180" height="72" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-opacity="0.4"/>
  <text x="750" y="228" text-anchor="middle" fill="#0969da" font-size="12" font-weight="600">Agent Context</text>
  <text x="750" y="248" text-anchor="middle" fill="#656d76" font-size="11">Context Bundle Pack</text>
  <line x1="570" y1="238" x2="660" y2="240" stroke="#0969da" stroke-width="1.5" opacity="0.4" marker-end="url(#a7)"/>
  <!-- Principles -->
  <rect x="40" y="316" width="800" height="34" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="440" y="338" text-anchor="middle" fill="#656d76" font-size="12">
    <tspan fill="#0969da" font-weight="600">Inspectable</tspan> ・ <tspan fill="#1a7f37" font-weight="600">Lightweight</tspan> ・ <tspan fill="#9a6700" font-weight="600">Scalable path</tspan> ・ <tspan fill="#8250df" font-weight="600">AI-compatible, not AI-dependent</tspan>
  </text>
</svg>
