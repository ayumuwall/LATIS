<svg viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" fill="#1f2328" font-size="14" font-weight="600">Impact Propagation Visualization (Auth Change Example)</text>
  <!-- Changed node -->
  <circle cx="440" cy="82" r="36" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="440" y="78" text-anchor="middle" fill="#cf222e" font-size="11" font-weight="700">Auth Method</text>
  <text x="440" y="94" text-anchor="middle" fill="#cf222e" font-size="10">Changed</text>
  <!-- Pulse -->
  <circle cx="440" cy="82" r="56" fill="none" stroke="#cf222e" stroke-width="0.5" opacity="0.3" stroke-dasharray="4,4"/>
  <circle cx="440" cy="82" r="80" fill="none" stroke="#cf222e" stroke-width="0.5" opacity="0.15" stroke-dasharray="4,4"/>
  <!-- Direct impact -->
  <line x1="404" y1="82" x2="240" y2="166" stroke="#cf222e" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="186" r="28" fill="#ffebe9" stroke="#cf222e" stroke-opacity="0.6"/>
  <text x="200" y="182" text-anchor="middle" fill="#cf222e" font-size="10" font-weight="500">Login</text>
  <text x="200" y="196" text-anchor="middle" fill="#cf222e" font-size="9">Flow</text>
  <line x1="476" y1="82" x2="640" y2="166" stroke="#cf222e" stroke-width="1.5" opacity="0.5"/>
  <circle cx="680" cy="186" r="28" fill="#ffebe9" stroke="#cf222e" stroke-opacity="0.6"/>
  <text x="680" y="182" text-anchor="middle" fill="#cf222e" font-size="10" font-weight="500">Session</text>
  <text x="680" y="196" text-anchor="middle" fill="#cf222e" font-size="9">Management</text>
  <line x1="440" y1="118" x2="440" y2="166" stroke="#cf222e" stroke-width="1.5" opacity="0.5"/>
  <circle cx="440" cy="194" r="28" fill="#ffebe9" stroke="#cf222e" stroke-opacity="0.6"/>
  <text x="440" y="190" text-anchor="middle" fill="#cf222e" font-size="10" font-weight="500">API</text>
  <text x="440" y="204" text-anchor="middle" fill="#cf222e" font-size="9">Tokens</text>
  <!-- Indirect impact -->
  <line x1="200" y1="214" x2="120" y2="272" stroke="#bc4c00" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="292" r="24" fill="#fff1e5" stroke="#bc4c00" stroke-opacity="0.4"/>
  <text x="100" y="296" text-anchor="middle" fill="#bc4c00" font-size="9" font-weight="500">UI Tests</text>
  <line x1="200" y1="214" x2="280" y2="272" stroke="#bc4c00" stroke-width="1" opacity="0.4"/>
  <circle cx="300" cy="292" r="24" fill="#fff1e5" stroke="#bc4c00" stroke-opacity="0.4"/>
  <text x="300" y="288" text-anchor="middle" fill="#bc4c00" font-size="9" font-weight="500">Password</text>
  <text x="300" y="300" text-anchor="middle" fill="#bc4c00" font-size="9">Reset</text>
  <line x1="680" y1="214" x2="760" y2="272" stroke="#bc4c00" stroke-width="1" opacity="0.4"/>
  <circle cx="780" cy="292" r="24" fill="#fff1e5" stroke="#bc4c00" stroke-opacity="0.4"/>
  <text x="780" y="296" text-anchor="middle" fill="#bc4c00" font-size="9" font-weight="500">Timeout</text>
  <line x1="680" y1="214" x2="600" y2="272" stroke="#bc4c00" stroke-width="1" opacity="0.4"/>
  <circle cx="580" cy="292" r="24" fill="#fff1e5" stroke="#bc4c00" stroke-opacity="0.4"/>
  <text x="580" y="288" text-anchor="middle" fill="#bc4c00" font-size="9" font-weight="500">Refresh</text>
  <text x="580" y="300" text-anchor="middle" fill="#bc4c00" font-size="9">Token</text>
  <line x1="440" y1="222" x2="440" y2="272" stroke="#bc4c00" stroke-width="1" opacity="0.4"/>
  <circle cx="440" cy="292" r="24" fill="#fff1e5" stroke="#bc4c00" stroke-opacity="0.4"/>
  <text x="440" y="288" text-anchor="middle" fill="#bc4c00" font-size="9" font-weight="500">Rate</text>
  <text x="440" y="300" text-anchor="middle" fill="#bc4c00" font-size="9">Limiting</text>
  <!-- Open question -->
  <line x1="300" y1="316" x2="300" y2="348" stroke="#cf222e" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>
  <rect x="225" y="348" width="150" height="26" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-opacity="0.3"/>
  <text x="300" y="366" text-anchor="middle" fill="#cf222e" font-size="9" font-weight="500">OAuth support needed?</text>
  <text x="300" y="340" text-anchor="middle" fill="#cf222e" font-size="8" font-style="italic">Open question blocks change</text>
  <!-- Legend -->
  <circle cx="80" cy="388" r="6" fill="#ffebe9" stroke="#cf222e"/>
  <text x="96" y="392" fill="#656d76" font-size="10">Direct impact</text>
  <circle cx="210" cy="388" r="6" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="226" y="392" fill="#656d76" font-size="10">Indirect impact</text>
</svg>
