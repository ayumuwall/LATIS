<svg viewBox="0 0 880 280" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="880" height="280" fill="#ffffff"/>
  <text x="440" y="24" text-anchor="middle" fill="#1f2328" font-size="14" font-weight="600">Four Questions LATIS Explores</text>
  <!-- Q1 -->
  <rect x="20" y="42" width="415" height="100" rx="10" fill="#f0f7ff" stroke="#0969da" stroke-opacity="0.4"/>
  <text x="44" y="72" fill="#0969da" font-size="22" font-weight="700">01</text>
  <text x="86" y="68" fill="#1f2328" font-size="13" font-weight="500">Can spec-driven development scale</text>
  <text x="86" y="88" fill="#1f2328" font-size="13" font-weight="500">if agreements are stored structurally?</text>
  <text x="86" y="114" fill="#656d76" font-size="11">Markdown alone hits limits. But what about structure?</text>
  <!-- Q2 -->
  <rect x="445" y="42" width="415" height="100" rx="10" fill="#faf5ff" stroke="#8250df" stroke-opacity="0.4"/>
  <text x="469" y="72" fill="#8250df" font-size="22" font-weight="700">02</text>
  <text x="511" y="68" fill="#1f2328" font-size="13" font-weight="500">Can agent context be reduced to</text>
  <text x="511" y="88" fill="#1f2328" font-size="13" font-weight="500">the minimum relevant agreement set?</text>
  <text x="511" y="114" fill="#656d76" font-size="11">Less text, without losing critical intent.</text>
  <!-- Q3 -->
  <rect x="20" y="154" width="415" height="100" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-opacity="0.4"/>
  <text x="44" y="184" fill="#1a7f37" font-size="22" font-weight="700">03</text>
  <text x="86" y="180" fill="#1f2328" font-size="13" font-weight="500">Can changes be reviewed through</text>
  <text x="86" y="200" fill="#1f2328" font-size="13" font-weight="500">impact and rationale, not raw text diff?</text>
  <text x="86" y="226" fill="#656d76" font-size="11">A review experience that preserves the "why".</text>
  <!-- Q4 -->
  <rect x="445" y="154" width="415" height="100" rx="10" fill="#fffbeb" stroke="#9a6700" stroke-opacity="0.4"/>
  <text x="469" y="184" fill="#9a6700" font-size="22" font-weight="700">04</text>
  <text x="511" y="180" fill="#1f2328" font-size="13" font-weight="500">Can layered scopes become a better</text>
  <text x="511" y="200" fill="#1f2328" font-size="13" font-weight="500">interface than a single global dep graph?</text>
  <text x="511" y="226" fill="#656d76" font-size="11">Large graphs collapse into noise. Layers may help.</text>
</svg>
