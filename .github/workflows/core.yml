name: P0参照実装の検査

on:
  push:
    paths: ["latis/**", "bin/**", "scripts/**", "tests/**", "pyproject.toml", ".github/workflows/core.yml", "docs/v0.3.0/examples/**"]
  pull_request:
    paths: ["latis/**", "bin/**", "scripts/**", "tests/**", "pyproject.toml", ".github/workflows/core.yml", "docs/v0.3.0/examples/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 構文検査
        run: python -m compileall -q latis scripts tests
      - name: API・保存・実CLIの受け入れ検査
        run: python -m unittest discover -v
      - name: パッケージ構築とインストール
        run: python -m pip install --no-deps .
      - name: インストールしたCLIと同梱ガイドの検査
        run: |
          python - <<'PY'
          import subprocess
          import sysconfig
          from pathlib import Path
          subprocess.run(["latis", "--db", "/tmp/latis-ci.sqlite", "init"], input=b"{}", check=True)
          assert (Path(sysconfig.get_path("data")) / "share/latis/docs/v0.3.0/LATIS_LLM_Guide.md").is_file()
          PY
