name: P0とP1の参照実装の検査

on:
  push:
    paths: ["latis/**", "bin/**", "scripts/**", "tests/**", "pyproject.toml", ".github/workflows/core.yml", "docs/v0.3.0/examples/**"]
  pull_request:
    paths: ["latis/**", "bin/**", "scripts/**", "tests/**", "pyproject.toml", ".github/workflows/core.yml", "docs/v0.3.0/examples/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 構文検査
        run: python -m compileall -q latis scripts tests
      - name: API・保存・実CLIの受け入れ検査
        run: python -m unittest discover -v
      - name: パッケージ構築とインストール
        run: python -m pip install --no-deps .
      - name: インストールしたCLIと同梱ガイドの検査
        run: |
          python - <<'PY'
          import subprocess
          import sysconfig
          import json
          import tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as directory:
              def call(operation, request):
                  result = subprocess.run(["latis", "--db", str(Path(directory) / "ci.sqlite"), operation], input=json.dumps(request).encode(), capture_output=True, cwd=directory, check=True)
                  response = json.loads(result.stdout)
                  assert response["ok"], response
                  return response["data"]
              assert {"search_descendants", "markdown_export"} <= set(call("init", {})["capabilities"])
              assert call("search", {"include_descendants": True})["applied_filters"]["expanded_scope_ids"] == []
              call("export", {"format": "markdown", "destination": str(Path(directory) / "view")})
              assert (Path(directory) / "view/index.md").is_file()
          assert (Path(sysconfig.get_path("data")) / "share/latis/docs/v0.3.0/LATIS_LLM_Guide.md").is_file()
          PY
